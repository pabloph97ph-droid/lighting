<svg width="64" height="64" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#150E28" />
      <stop offset="100%" stopColor="#07050D" />
    </linearGradient>

    <!-- Border glow gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#D8B4FE" />
      <stop offset="45%" stopColor="#9333EA" />
      <stop offset="100%" stopColor="#581C87" />
    </linearGradient>

    <!-- J Sculptural Gradient -->
    <linearGradient id="jGrad" x1="6" y1="4" x2="30" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="25%" stopColor="#E9D5FF" />
      <stop offset="55%" stopColor="#C084FC" />
      <stop offset="80%" stopColor="#9333EA" />
      <stop offset="100%" stopColor="#6B21A8" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="jGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" floodColor="#C084FC" floodOpacity="0.75" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="1" y="1" width="34" height="34" rx="9" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Violet Ambient Core -->
  <circle cx="18" cy="18" r="10" fill="#7C3AED" fill-opacity="0.3" filter="url(#jGlow)" />

  <!-- The J Sculptural Letterform -->
  <path
    d="M21.5 8.5V21.5C21.5 24.8 18.8 27.5 15.5 27.5C12.4 27.5 9.8 25.1 9.6 22C9.5 21.2 10.2 20.5 11 20.5C11.8 20.5 12.4 21.1 12.6 21.8C12.8 23.3 14 24.5 15.5 24.5C17.2 24.5 18.5 23.2 18.5 21.5V8.5C18.5 7.7 19.2 7 20 7C20.8 7 21.5 7.7 21.5 8.5Z"
    fill="url(#jGrad)"
    filter="url(#jGlow)"
  />

  <!-- Accent Top Notch and Spark -->
  <path d="M17 9.2H24.5" stroke="#F5F3FF" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="24.5" cy="9.2" r="1.3" fill="#FFFFFF" />
</svg>
